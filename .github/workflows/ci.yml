name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t laravel-k8s-app:${{ github.sha }} ./app

      - name: Smoke test (PHP runs inside the image)
        run: docker run --rm laravel-k8s-app:${{ github.sha }} php -v
